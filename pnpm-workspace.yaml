packages:
  - packages/*
  - playground

# pnpm 11 の minimumReleaseAge デフォルト(1日)を無効化。pnpm 10 まではガード無し(=0)
# だったため挙動を揃える。deps 更新は手動レビュー・テスト前提。
minimumReleaseAge: 0

# ビルドスクリプト実行ポリシー。pnpm 11 で onlyBuiltDependencies は廃止 → allowBuilds(map)へ。
# esbuild はビルドが必要なため true。それ以外は未実行(false)。
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  vue-demi: false

# Snyk / GitHub Advisory 由来のセキュリティ override。同一メジャー内のパッチ更新で解決するもののみ、
# メジャーを跨がないようレンジを区切って指定する(docustation 等と同じ運用)。
# fast-uri: 3.1.6 (2026-08-23) で host confusion / SSRF 系4件を解消、3.1.7 (2026-09-03) で
#   SNYK-JS-FASTURI-19502854 / 19502739 の追加 2 件を解消
#   (GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8, GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc)。
#   ajv → schema-utils → webpack 経由の推移的依存で、pnpm update では lockfile が動かなかったため override で固定。
overrides:
  fast-uri@^3.0.0: ^3.1.7
  # undici: 2026-09-04 の一括 advisory(cache interceptor のクロスオリジン汚染 GHSA-vp8m-p9jh-q5pm、
  # BalancedPool の TLS 検証コールバック欠落 GHSA-w293-vg96-wgc3、WebSocket サブプロトコルの
  # 未処理 TypeError GHSA-rfgv-xxqx-mfg5 ほか 8 件)。 nuxt 本体経由の 8 系のみ。
  undici@^8.0.0: ^8.10.2
  # svgo: 4.1.0 (2026-08-24) で removeScripts プラグインの XSS 2件に対応
  #   GHSA-w27v-7q3p-w38r (名前空間付き <svg:a> と制御文字入り URL スキームの回避)
  #   GHSA-4vpr-x523-8j87 (<foreignObject> 内の HTML イベントハンドラ未除去)
  #   cssnano → postcss-svgo 経由の推移的依存。4.1.0 は XML 検証が厳格化されるため build で検証済み。
  svgo@^4.0.0: ^4.1.0
