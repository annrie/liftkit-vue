packages:
  - packages/*
  - playground

# pnpm 11 の minimumReleaseAge デフォルト(1日)を無効化。pnpm 10 まではガード無し(=0)
# だったため挙動を揃える。deps 更新は手動レビュー・テスト前提。
minimumReleaseAge: 0

# ビルドスクリプト実行ポリシー。pnpm 11 で onlyBuiltDependencies は廃止 → allowBuilds(map)へ。
# esbuild はビルドが必要なため true。それ以外は未実行(false)。
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  vue-demi: false

# Snyk / GitHub Advisory 由来のセキュリティ override。同一メジャー内のパッチ更新で解決するもののみ、
# メジャーを跨がないようレンジを区切って指定する(docustation 等と同じ運用)。
# fast-uri: 3.1.6 (2026-08-23) で host confusion / SSRF 系4件を解消、3.1.7 (2026-09-03) で
#   SNYK-JS-FASTURI-19502854 / 19502739 の追加 2 件を解消
#   (GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8, GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc)。
#   ajv → schema-utils → webpack 経由の推移的依存で、pnpm update では lockfile が動かなかったため override で固定。
overrides:
  #   2026-09-17: 3.1.8 で SNYK-JS-FASTURI-19846649 (CVE-2026-86472、host の %エンコード大文字を
  #   正規化せず allowlist / denylist を迂回できる Improper Handling of Case Sensitivity) に対応
  #   2026-10-24: 3.1.9 で GHSA-w74x-v6f9-j3xg (%エンコードされた scheme のデコードによる scheme 偽装)・
  #   GHSA-wjr9-j795-jxcr (WHATWG の host 正規化を検査しない host confusion) ほか Low 2件に対応
  fast-uri@^3.0.0: ^3.1.9
  # serialize-javascript: 2026-10-24。7.1.3 で GHSA-m5mm-p8h7-m29v (関数本体末尾の </script による XSS、Low) に対応。
  #   nitropack → @rollup/plugin-terser 経由のビルド時依存。
  serialize-javascript@^7.0.0: ^7.1.3
  # undici: 2026-09-04 の一括 advisory(cache interceptor のクロスオリジン汚染 GHSA-vp8m-p9jh-q5pm、
  # BalancedPool の TLS 検証コールバック欠落 GHSA-w293-vg96-wgc3、WebSocket サブプロトコルの
  # 未処理 TypeError GHSA-rfgv-xxqx-mfg5 ほか 8 件)。 nuxt 本体経由の 8 系のみ。
  # 2026-10-20: 10-15 の一括 advisory(Agent の TLS オプション欠落 GHSA-2m5v-pch6-74hx、TLS 1.2 の
  # 再ネゴシエーション DoS GHSA-qrxm-fqhp-jwvm、content-encoding の未処理エラー GHSA-xjj6-f33q-929c
  # ほか 7 件。修正は 6.29.1 / 7.30.1 / 8.12.2)に合わせて下限を 8.12.2 へ。Snyk の通知は
  # 「No remediation available yet」だったが、修正版は 10-15 に出ていた。
  undici@^8.0.0: ^8.12.2
  # svgo: 4.1.0 (2026-08-24) で removeScripts プラグインの XSS 2件に対応
  #   GHSA-w27v-7q3p-w38r (名前空間付き <svg:a> と制御文字入り URL スキームの回避)
  #   GHSA-4vpr-x523-8j87 (<foreignObject> 内の HTML イベントハンドラ未除去)
  #   cssnano → postcss-svgo 経由の推移的依存。4.1.0 は XML 検証が厳格化されるため build で検証済み。
  svgo@^4.0.0: ^4.1.0
  # postcss-selector-parser: 2026-10-06 の Snyk 指摘(Inefficient Algorithmic Complexity、7.1.5 以前)。
  #   7.1.6 で解消。packages/nuxt と playground が postcss 系プラグイン経由で牽引する推移的依存。
  postcss-selector-parser@^7.0.0: ^7.1.6
  # seroval: Snyk の Allocation of Resources Without Limits(1.6.2 以前)。1.6.3 以降で解消。
  #   nuxt (@nuxt/vite-builder) 経由の推移的依存。
  seroval@^1.0.0: ^1.6.8
  # brace-expansion: 連続する空 {} グループによる指数時間展開 DoS と再帰によるスタック枯渇
  #   (GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr)。2 系と 5 系が同居する。
  #   一律に 5 系へ統一してはいけない。v5 は default export を廃止しており、下位系統の
  #   minimatch が落ちるので、メジャーごとにレンジを区切って各系統の最新へ上げる。
  brace-expansion@^2.0.0: ^2.1.7
  brace-expansion@^5.0.0: ^5.0.12
  # shell-quote: Snyk の Command Injection(1.10.0 以前)。1.11.0 以降で解消。
  #   @nuxt/devtools → launch-editor 経由の dev 依存。
  shell-quote@^1.0.0: ^1.12.0
  # --- 以下は override しない(上流待ち)。2026-10-20 時点の Snyk 指摘 ---
  # 修正版が存在しない(npm の最新が現行版):
  #   picomatch 4.0.7 (SNYK-JS-PICOMATCH-21248802、ReDoS。全バージョンが対象で修正版なし。
  #   playground と packages/nuxt の両方で通知。ビルド時のグロブ展開で、パターンは開発者が書いたものだけ)
